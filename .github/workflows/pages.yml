name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit tests
        run: pnpm typecheck && pnpm lint && pnpm test
      # Lesson videos are release assets (kept out of git history); copy them into the site.
      - name: Fetch published media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/media
          for tag in $(gh release list --json tagName -q '.[].tagName | select(startswith("media-"))'); do
            gh release download "$tag" --dir public/media --clobber
          done
          ls -la public/media
      - name: Build static site
        run: pnpm build:pages
      # Browser checks use the runner's preinstalled Google Chrome (playwright-core, no download).
      - name: Site checks (offline)
        run: pnpm test:e2e
      # Real webR (R in WebAssembly) from r-wasm.org: all 15 validators (reference passes,
      # starter fails), the adversarial grader cases, and the attempt/insights flow.
      # One retry absorbs a transient CDN outage; a real regression fails both runs and blocks deploy.
      - name: Validator self-test and grader hardening (real webR)
        run: pnpm test:validators || { echo "::warning::retrying once (possible network failure)"; sleep 30; pnpm test:validators; }
      - name: Attempt evidence, migration, and insights (real webR)
        run: pnpm test:e2e:attempts || { echo "::warning::retrying once (possible network failure)"; sleep 30; pnpm test:e2e:attempts; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
